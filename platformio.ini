; ============================================================================
;  ESP32-S3 SuperMini 无线激光对靶模块 — PlatformIO 工程配置
;  方案文档: ESP32S3_SuperMini_Laser_BLE_Project_Plan.md
; ============================================================================
;  首次使用前请确认手上芯片的实际参数（串口启动日志会打印）：
;    Chip Model / Flash Size / PSRAM Size / Flash Mode
;  然后用下面的 board_build.* 覆盖成实际值。
; ============================================================================

[env:esp32s3]
platform = espressif32@^6.9.0
board = esp32-s3-devkitc-1
framework = arduino

; ---- ESP32-S3 SuperMini 实际参数（按手上板子改）---------------------------
; 大多数 SuperMini 是 4 MB Flash、无 PSRAM。
board_build.flash_size = 4MB
board_upload.flash_size = 4MB
board_build.partitions = default.csv
; 如果手上是 ESP32-S3FH4R2（4 MB Flash + 2 MB PSRAM），把下面这行打开：
;board_build.psram = enabled
;board_build.arduino.memory_type = qio_qspi

monitor_speed = 115200
upload_speed = 921600
; 板子上的 USB Type-C 走 ESP32-S3 原生 USB，不用改端口，插上就是 COMx。

; 最后一个 -D 是同时在线客户端上限。按用户要求只用 1 台（省电：连上就停广播）。
; 要恢复多台上位机同时控制，把 1 改回 3（代码里的多客户端逻辑仍然保留）。
; 注释必须顶格写，不能缩进进 build_flags 的值里，否则会被当成编译参数。
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=0
    -DCONFIG_BT_NIMBLE_MAX_CONNECTIONS=1

; src/probe/ 是独立的探针固件，正式固件里排除掉（两个 main.cpp 会撞 setup/loop）
build_src_filter = +<*> -<probe/>

; NimBLE-Arduino 固定 1.4.x：API 稳定、体积小，与方案中的回调写法一致。
; 升级到 2.x 需要改回调签名（NimBLEConnInfo&）和 AttValue 取值方式。
lib_deps =
    h2zero/NimBLE-Arduino@^1.4.3

; ---- 如果以后要迁到 Arduino core 3.x，把上面 platform 换掉：
;platform = https://github.com/pioarduino/platform-espressif32/releases/download/51.03.07/platform-espressif32.zip

; ============================================================================
;  临时诊断环境：电池检测引脚探针（只读 GPIO1/2/3 的 ADC，不碰激光）
;  注意：src_dir 不是 env 级选项（写了会被忽略、编出来还是主固件），
;        必须用 build_src_filter 只放行 src/probe/。
;  烧录：python -m platformio run -e adcprobe -t upload
;  烧回正式固件：python -m platformio run -e esp32s3 -t upload
; ============================================================================
; ============================================================================
;  实验环境：Arduino core 3.x（IDF 5.5）+ NimBLE-Arduino 2.x —— 省电/升级路线
;  烧录：python -m platformio run -e esp32s3_next -t upload
;  说明：
;   - NimBLE 2.x 的 API 兼容层在 ble_server.cpp 顶部（NIMBLE_V2 宏），两环境共用源码。
;   - 栈级连接数上限在 2.x 里走 MYNEWT_VAL_BLE_MAX_CONNECTIONS（1.x 的
;     CONFIG_BT_NIMBLE_MAX_CONNECTIONS 同时保留给应用层 BLE_MAX_CLIENTS 用）。
;   - 本平台与主环境共用全局包目录里的 framework-arduinoespressif32（版本不同），
;     两个环境来回切换编译时各会重装一次（有本地缓存，约 1~2 min），属正常现象。
; ============================================================================
[env:esp32s3_next]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312/platform-espressif32.zip
extends = env:esp32s3
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=0
    -DCONFIG_BT_NIMBLE_MAX_CONNECTIONS=1
    -DMYNEWT_VAL_BLE_MAX_CONNECTIONS=1
lib_deps =
    h2zero/NimBLE-Arduino@^2.1.0

[env:adcprobe]
extends = env:esp32s3
build_src_filter = -<*> +<probe/>
